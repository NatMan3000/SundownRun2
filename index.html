<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- added to a phone's home screen, the game gets the whole screen, no browser bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sundown Run" />
    <meta name="theme-color" content="#0b0614" />
    <!-- use-credentials: the online copy sits behind the Access login, and a plain manifest fetch sends no cookie -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!--TOUCH-ICON-->
    <!-- the game is already dark: tell the browser and dark-mode extensions not to recolour it -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <title>Sundown Run II</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22><stop offset=%220%22 stop-color=%22%23ffd36b%22/><stop offset=%221%22 stop-color=%22%23ff2e88%22/></linearGradient></defs><circle cx=%2250%22 cy=%2256%22 r=%2240%22 fill=%22url(%23g)%22/><rect x=%220%22 y=%2262%22 width=%22100%22 height=%225%22 fill=%22%23120a24%22/><rect x=%220%22 y=%2274%22 width=%22100%22 height=%227%22 fill=%22%23120a24%22/><rect x=%220%22 y=%2286%22 width=%22100%22 height=%229%22 fill=%22%23120a24%22/></svg>" />
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { background: #0b0614; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
